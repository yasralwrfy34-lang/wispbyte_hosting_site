<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIKO HOST | الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#FFD700;--gold2:#FFA500;--red:#FF3D5A;--bg:#030507;--card-bg:rgba(6,10,22,.88)}
html,body{height:100%}
body{font-family:'Tajawal',sans-serif;min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

/* === خلفية الجزيئات === */
#particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* === شبكة متحركة === */
.grid-layer{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,215,0,.03)1px,transparent 1px),linear-gradient(90deg,rgba(255,215,0,.03)1px,transparent 1px);
  background-size:55px 55px;animation:gridDrift 30s linear infinite}
@keyframes gridDrift{0%{background-position:0 0}100%{background-position:55px 55px}}

/* === توهجات خلفية === */
.glow-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:orbDrift 14s ease-in-out infinite}
.go1{width:600px;height:600px;background:rgba(255,215,0,.07);top:-180px;right:-150px;animation-delay:0s}
.go2{width:450px;height:450px;background:rgba(255,61,90,.06);bottom:-120px;left:-120px;animation-delay:-5s}
.go3{width:350px;height:350px;background:rgba(255,140,0,.05);top:40%;left:40%;animation-delay:-10s}
@keyframes orbDrift{0%,100%{transform:translate(0,0)scale(1)}33%{transform:translate(30px,-40px)scale(1.06)}66%{transform:translate(-20px,28px)scale(.94)}}

/* === البطاقة === */
.wrapper{position:relative;z-index:10;width:100%;max-width:470px;margin:20px;animation:wrapIn .75s cubic-bezier(.34,1.56,.64,1)}
@keyframes wrapIn{from{opacity:0;transform:translateY(45px)scale(.94)}to{opacity:1;transform:translateY(0)scale(1)}}
.card{background:var(--card-bg);backdrop-filter:blur(30px)saturate(1.5);border-radius:32px;border:1px solid rgba(255,215,0,.18);
  box-shadow:0 0 0 1px rgba(255,215,0,.05),0 35px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05);
  padding:46px 38px;transition:border-color .35s,box-shadow .35s}
.card:hover{border-color:rgba(255,215,0,.32);box-shadow:0 0 50px rgba(255,215,0,.06),0 35px 70px rgba(0,0,0,.65)}

/* === شعار MK نيوني === */
.logo-area{text-align:center;margin-bottom:34px}
.mk-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:78px;height:78px;border-radius:22px;margin-bottom:16px;
  background:linear-gradient(145deg,#06090f,#0c1628);
  border:2px solid var(--gold);
  font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;
  position:relative;overflow:hidden;animation:mkPulse 2.8s ease-in-out infinite;
  cursor:default;
}
.mk-badge .mk-text{
  position:relative;z-index:2;
  background:linear-gradient(135deg,#FFD700,#FFA500,#FFD700);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:2px;
}
.mk-badge::before{
  content:'';position:absolute;inset:-60%;z-index:1;
  background:conic-gradient(from 0deg,transparent 0%,rgba(255,215,0,.2)30%,transparent 60%);
  animation:mkSpin 3.5s linear infinite;
}
.mk-badge::after{
  content:'';position:absolute;inset:3px;border-radius:18px;
  background:linear-gradient(145deg,rgba(255,215,0,.08),transparent);z-index:1;
}
@keyframes mkPulse{
  0%,100%{box-shadow:0 0 16px rgba(255,215,0,.35),0 0 35px rgba(255,215,0,.18),inset 0 0 18px rgba(255,215,0,.06)}
  50%{box-shadow:0 0 28px rgba(255,215,0,.65),0 0 55px rgba(255,215,0,.32),inset 0 0 30px rgba(255,215,0,.12)}
}
@keyframes mkSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.logo-name{font-family:'Orbitron',sans-serif;font-size:1.75rem;font-weight:900;letter-spacing:4px;display:block;
  background:linear-gradient(135deg,#FFD700,#FFA500,#fff8d0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,215,0,.45));margin-bottom:6px}
.logo-tagline{font-size:.78rem;color:#4a5a78;letter-spacing:1.5px;line-height:1.5}
.logo-tagline span{color:rgba(255,215,0,.55)}

/* === تبويبات === */
.tabs-bar{display:flex;background:rgba(0,0,0,.38);border-radius:14px;padding:5px;margin-bottom:28px;
  border:1px solid rgba(255,255,255,.05);gap:4px}
.tab-btn{flex:1;padding:10px 8px;border-radius:10px;border:none;background:transparent;
  color:#4b5a7a;font-family:'Tajawal',sans-serif;font-size:.88rem;font-weight:700;
  cursor:pointer;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:7px}
.tab-btn i{font-size:.85rem}
.tab-btn:hover:not(.active){background:rgba(255,255,255,.04);color:#7a8aaa}
.tab-btn.active{background:linear-gradient(135deg,rgba(255,215,0,.16),rgba(255,140,0,.08));
  color:var(--gold);border:1px solid rgba(255,215,0,.22);
  box-shadow:0 0 14px rgba(255,215,0,.09),inset 0 0 10px rgba(255,215,0,.04)}

/* === النماذج === */
.auth-form{display:none;animation:formFade .22s ease}
.auth-form.active{display:block}
@keyframes formFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* === حقول الإدخال === */
.field{margin-bottom:17px}
.field-lbl{font-size:.72rem;color:#4b5a7a;margin-bottom:5px;display:block;font-weight:600;letter-spacing:.4px}
.field-wrap{position:relative;display:flex;align-items:center;background:rgba(0,0,0,.42);
  border:1px solid rgba(255,215,0,.12);border-radius:13px;overflow:hidden;transition:border-color .22s,box-shadow .22s}
.field-wrap:focus-within{border-color:rgba(255,215,0,.48);box-shadow:0 0 0 3px rgba(255,215,0,.06),0 0 18px rgba(255,215,0,.04)}
.field-ico{width:44px;display:flex;align-items:center;justify-content:center;color:#34425e;font-size:.85rem;flex-shrink:0}
.field-inp{flex:1;background:transparent;border:none;outline:none;color:#e8eeff;
  font-family:'Tajawal',sans-serif;font-size:.9rem;padding:13px 0;direction:ltr;text-align:right}
.field-inp::placeholder{color:#243048}
.eye-btn{background:none;border:none;cursor:pointer;color:#34425e;padding:0 13px;font-size:.85rem;transition:color .15s}
.eye-btn:hover{color:var(--gold)}

/* === زر الإرسال === */
.sub-btn{width:100%;padding:13px;
  background:linear-gradient(135deg,#FFD700 0%,#FFA500 60%,#FF8C00 100%);
  border:none;border-radius:13px;color:#080606;
  font-family:'Tajawal',sans-serif;font-size:.96rem;font-weight:900;letter-spacing:.4px;
  cursor:pointer;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 5px 22px rgba(255,215,0,.22),0 0 0 1px rgba(255,215,0,.1);margin-top:6px;position:relative;overflow:hidden}
.sub-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent);opacity:0;transition:opacity .2s}
.sub-btn:hover::after{opacity:1}
.sub-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,215,0,.32),0 0 0 1px rgba(255,215,0,.2)}
.sub-btn:active{transform:translateY(0)}
.sub-btn.loading{opacity:.72;pointer-events:none}

/* === رسائل === */
.msg-box{padding:10px 14px;border-radius:11px;font-size:.8rem;margin-bottom:14px;display:none;align-items:center;gap:8px}
.msg-box.err{background:rgba(255,61,90,.1);border:1px solid rgba(255,61,90,.28);color:#ff8fa0;display:flex}
.msg-box.ok{background:rgba(0,200,100,.09);border:1px solid rgba(0,200,100,.25);color:#6ee7b7;display:flex}

/* === قوة كلمة المرور === */
.str-bar{height:3px;background:rgba(255,255,255,.05);border-radius:4px;margin-top:5px;overflow:hidden}
.str-fill{height:100%;border-radius:4px;transition:width .3s,background .3s;width:0}

/* === تذييل === */
.card-foot{text-align:center;margin-top:22px;font-size:.68rem;color:#243048;
  border-top:1px solid rgba(255,255,255,.04);padding-top:16px}
.card-foot a{color:rgba(255,215,0,.42);text-decoration:none;transition:color .2s}
.card-foot a:hover{color:var(--gold)}

@media(max-width:480px){
  .card{padding:32px 22px;border-radius:26px}
  .mk-badge{width:68px;height:68px;font-size:22px}
  .logo-name{font-size:1.45rem}
}
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div class="grid-layer"></div>
<div class="glow-orb go1"></div>
<div class="glow-orb go2"></div>
<div class="glow-orb go3"></div>

<div class="wrapper">
<div class="card">

  <!-- شعار -->
  <div class="logo-area">
    <div class="mk-badge"><span class="mk-text">MK</span></div>
    <span class="logo-name">MIKO HOST</span>
    <div class="logo-tagline">مرحباً بك في <span>مستقبل الاستضافة السحابية</span> ✦</div>
  </div>

  <!-- تبويبات -->
  <div class="tabs-bar">
    <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">
      <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
    </button>
    <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">
      <i class="fas fa-user-plus"></i> إنشاء حساب
    </button>
  </div>

  <!-- نموذج الدخول -->
  <div class="auth-form active" id="loginForm">
    <div class="msg-box" id="loginMsg"></div>
    <div class="field">
      <label class="field-lbl">اسم المستخدم</label>
      <div class="field-wrap">
        <div class="field-ico"><i class="fas fa-user"></i></div>
        <input class="field-inp" id="loginUser" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
    </div>
    <div class="field">
      <label class="field-lbl">كلمة المرور</label>
      <div class="field-wrap">
        <div class="field-ico"><i class="fas fa-lock"></i></div>
        <input class="field-inp" id="loginPass" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="eye-btn" onclick="toggleEye('loginPass',this)"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button class="sub-btn" id="loginBtn" onclick="doLogin()">
      <i class="fas fa-arrow-left"></i> دخول
    </button>
  </div>

  <!-- نموذج التسجيل -->
  <div class="auth-form" id="registerForm">
    <div class="msg-box" id="registerMsg"></div>
    <div class="field">
      <label class="field-lbl">اسم المستخدم</label>
      <div class="field-wrap">
        <div class="field-ico"><i class="fas fa-user"></i></div>
        <input class="field-inp" id="regUser" type="text" placeholder="3 أحرف على الأقل" autocomplete="username">
      </div>
    </div>
    <div class="field">
      <label class="field-lbl">كلمة المرور</label>
      <div class="field-wrap">
        <div class="field-ico"><i class="fas fa-lock"></i></div>
        <input class="field-inp" id="regPass" type="password" placeholder="4 أحرف على الأقل" autocomplete="new-password" oninput="checkStr(this.value)">
        <button class="eye-btn" onclick="toggleEye('regPass',this)"><i class="fas fa-eye"></i></button>
      </div>
      <div class="str-bar"><div class="str-fill" id="strFill"></div></div>
    </div>
    <div class="field">
      <label class="field-lbl">تأكيد كلمة المرور</label>
      <div class="field-wrap">
        <div class="field-ico"><i class="fas fa-lock"></i></div>
        <input class="field-inp" id="regPassC" type="password" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()">
        <button class="eye-btn" onclick="toggleEye('regPassC',this)"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button class="sub-btn" id="registerBtn" onclick="doRegister()">
      <i class="fas fa-user-plus"></i> إنشاء الحساب
    </button>
  </div>

  <div class="card-foot">
    MIKO HOST &copy; 2025 — <a href="https://t.me/a_u711" target="_blank"><i class="fab fa-telegram"></i> تواصل معنا</a>
  </div>
</div>
</div>

<script>
/* ═══ جزيئات الخلفية ═══ */
(function(){
  const cv=document.getElementById('particleCanvas');
  const ctx=cv.getContext('2d');
  let W,H,pts=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  resize();addEventListener('resize',resize);
  const COLORS=['#FFD700','#FFA500','#FF8C00','#FFEC6E'];
  function mkPt(){
    return{x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*.55,vy:-(Math.random()*1.6+.4),
      r:Math.random()*2.2+.5,life:0,max:Math.random()*280+140,
      op:0,mop:Math.random()*.55+.2,c:COLORS[Math.floor(Math.random()*COLORS.length)]};
  }
  for(let i=0;i<65;i++){const p=mkPt();p.y=Math.random()*H;p.life=Math.random()*p.max;pts.push(p)}
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach((p,i)=>{
      p.life++;p.x+=p.vx;p.y+=p.vy;
      const t=p.life/p.max;
      p.op=t<.12?(t/.12)*p.mop:t>.78?((1-t)/.22)*p.mop:p.mop;
      ctx.save();ctx.globalAlpha=p.op;ctx.fillStyle=p.c;
      ctx.shadowColor=p.c;ctx.shadowBlur=7;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
      if(p.life>=p.max||p.y<-10)pts[i]=mkPt();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function switchTab(t){
  ['login','register'].forEach(x=>{
    document.getElementById(x+'Form').classList.toggle('active',x===t);
    document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===t);
  });
  clearMsgs();
}
function clearMsgs(){
  ['loginMsg','registerMsg'].forEach(id=>{
    const e=document.getElementById(id);e.className='msg-box';e.innerHTML='';
  });
}
function showMsg(id,txt,type){
  const e=document.getElementById(id);e.className='msg-box '+(type==='ok'?'ok':'err');
  e.innerHTML=`<i class="fas ${type==='ok'?'fa-check-circle':'fa-exclamation-circle'}"></i> ${txt}`;
}
function toggleEye(id,btn){
  const i=document.getElementById(id);const s=i.type==='password';
  i.type=s?'text':'password';btn.innerHTML=`<i class="fas fa-eye${s?'-slash':''}"></i>`;
}
function checkStr(v){
  const f=document.getElementById('strFill');let s=0;
  if(v.length>=6)s++;if(v.length>=10)s++;if(/[A-Z0-9]/.test(v))s++;if(/[^a-zA-Z0-9]/.test(v))s++;
  const c=['#ff4444','#ff8800','#ffd700','#00dc64'],w=['18%','45%','72%','100%'];
  f.style.background=c[s-1]||'#ff4444';f.style.width=v.length?(w[s-1]||'8%'):'0';
}
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value.trim();
  if(!u||!p){showMsg('loginMsg','يرجى ملء جميع الحقول','err');return}
  const btn=document.getElementById('loginBtn');
  btn.classList.add('loading');btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.success){showMsg('loginMsg','تم تسجيل الدخول ✅','ok');btn.innerHTML='<i class="fas fa-check"></i> تم!';setTimeout(()=>location.href=d.redirect||'/',700);}
    else{showMsg('loginMsg',d.message||'بيانات خاطئة','err');btn.classList.remove('loading');btn.innerHTML='<i class="fas fa-arrow-left"></i> دخول';}
  }catch(e){showMsg('loginMsg','خطأ في الاتصال بالخادم','err');btn.classList.remove('loading');btn.innerHTML='<i class="fas fa-arrow-left"></i> دخول';}
}
async function doRegister(){
  const u=document.getElementById('regUser').value.trim(),p=document.getElementById('regPass').value.trim(),c=document.getElementById('regPassC').value.trim();
  if(!u||!p){showMsg('registerMsg','يرجى ملء جميع الحقول','err');return}
  if(u.length<3){showMsg('registerMsg','اسم المستخدم 3 أحرف على الأقل','err');return}
  if(p.length<4){showMsg('registerMsg','كلمة المرور 4 أحرف على الأقل','err');return}
  if(p!==c){showMsg('registerMsg','كلمتا المرور غير متطابقتين','err');return}
  const btn=document.getElementById('registerBtn');
  btn.classList.add('loading');btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري الإنشاء...';
  try{
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.success){showMsg('registerMsg','تم إنشاء الحساب ✅','ok');btn.innerHTML='<i class="fas fa-check"></i> تم!';setTimeout(()=>switchTab('login'),1600);}
    else{showMsg('registerMsg',d.message||'فشل الإنشاء','err');btn.classList.remove('loading');btn.innerHTML='<i class="fas fa-user-plus"></i> إنشاء الحساب';}
  }catch(e){showMsg('registerMsg','خطأ في الاتصال بالخادم','err');btn.classList.remove('loading');btn.innerHTML='<i class="fas fa-user-plus"></i> إنشاء الحساب';}
}
fetch('/api/current_user').then(r=>r.json()).then(d=>{if(d.success)location.href='/'}).catch(()=>{});
</script>
</body>
</html>
