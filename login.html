<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MIKO HOST | الدخول - تسجيل  </title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== 1. المتغيرات والألوان المائية ===== */
        :root {
            --aqua-primary: #00e5ff;
            --aqua-deep: #051622;
            --aqua-glow: rgba(0, 229, 255, 0.35);
            --glass-bg: rgba(10, 35, 50, 0.8);
        }

        /* ===== 2. تنسيق الخلفية العامة ===== */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0a2d41 0%, #051622 100%);
            font-family: 'Tajawal', sans-serif;
            color: #fff;
            padding: 20px;
        }

        /* ===== 3. شعار MK الدوار ===== */
        .logo-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mk-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top: 3px solid var(--aqua-primary);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 50%;
            animation: rotateRing 4s linear infinite;
        }

        .mk-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: var(--aqua-primary);
            font-weight: 900;
            text-shadow: 0 0 15px var(--aqua-glow);
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== 4. الكارد الزجاجي المائي ===== */
        .aqua-card {
            background: var(--glass-bg);
            width: 100%;
            max-width: 460px;
            padding: 32px 28px;
            border-radius: 45px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            text-align: center;
            transition: transform 0.3s ease;
        }

        /* ===== 5. أزرار التبديل (Tabs) ===== */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 25px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--aqua-primary);
            font-weight: 700;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: var(--aqua-primary);
            color: #000;
            box-shadow: 0 0 20px var(--aqua-glow);
        }

        /* ===== 6. حقول الإدخال المائية ===== */
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 18px;
            padding: 12px 15px;
            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--aqua-primary);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
            transform: scale(1.02);
        }

        .input-wrapper i {
            color: var(--aqua-primary);
            opacity: 0.7;
            margin-left: 10px;
        }

        .input-field {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            outline: none;
            font-family: 'Tajawal';
            font-size: 0.9rem;
        }

        .input-field::placeholder {
            color: #6c8da0;
        }

        /* ===== 7. زر الإرسال المتدفق ===== */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--aqua-primary), #008fa0);
            color: #000;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px var(--aqua-glow);
            filter: brightness(1.1);
        }

        .submit-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* ===== 8. صندوق الرسائل ===== */
        .msg-box {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .msg-box.error {
            background: rgba(255, 61, 90, 0.15);
            border: 1px solid rgba(255, 61, 90, 0.4);
            color: #ff8fa0;
            display: flex;
        }
        .msg-box.success {
            background: rgba(0, 220, 100, 0.12);
            border: 1px solid rgba(0, 220, 100, 0.3);
            color: #6ee7b7;
            display: flex;
        }

        /* ===== 9. شريط قوة كلمة المرور ===== */
        .strength-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s, background 0.3s;
            width: 0;
        }

        /* ===== 10. التحكم في ظهور النماذج ===== */
        .form-content { display: none; }
        .form-content.active { display: block; animation: waterFade 0.5s ease; }

        @keyframes waterFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 11. تذييل ===== */
        .card-footer {
            margin-top: 24px;
            font-size: 0.7rem;
            color: #5b7a8c;
            border-top: 1px solid rgba(0, 229, 255, 0.15);
            padding-top: 16px;
        }
        .card-footer a {
            color: var(--aqua-primary);
            text-decoration: none;
        }
        .card-footer a:hover {
            text-decoration: underline;
        }

        /* ===== 12. توافق الجوال ===== */
        @media (max-width: 500px) {
            .aqua-card { padding: 24px 18px; margin: 16px; }
            .tab-btn { padding: 8px; font-size: 0.8rem; }
            .input-wrapper { padding: 10px 12px; }
            .submit-btn { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="logo-container">
        <div class="mk-ring"></div>
        <div class="mk-text">MK</div>
    </div>

    <div class="aqua-card">
        <div class="tabs">
            <button class="tab-btn active" id="tabLoginBtn" onclick="showForm('login')">
                <i class="fas fa-unlock"></i> دخول
            </button>
            <button class="tab-btn" id="tabRegisterBtn" onclick="showForm('register')">
                <i class="fas fa-user-plus"></i> إنشاء
            </button>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="login-form" class="form-content active">
            <div class="msg-box" id="loginMsg"></div>
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" class="input-field" id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input type="password" class="input-field" id="loginPass" placeholder="كلمة المرور" autocomplete="current-password">
                    <button class="eye-btn" type="button" onclick="toggleEye('loginPass', this)" style="background: none; border: none; color: var(--aqua-primary); cursor: pointer; margin-right: 8px;"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <button class="submit-btn" id="loginBtn" onclick="doLogin()">
                <i class="fas fa-arrow-left"></i> دخول للمنصة
            </button>
        </div>

        <!-- نموذج إنشاء حساب -->
        <div id="register-form" class="form-content">
            <div class="msg-box" id="registerMsg"></div>
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" class="input-field" id="regUser" placeholder="اسم المستخدم (3 أحرف على الأقل)" autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="input-field" id="regPass" placeholder="كلمة المرور (4 أحرف على الأقل)" autocomplete="new-password" oninput="checkStrength(this.value)">
                    <button class="eye-btn" type="button" onclick="toggleEye('regPass', this)" style="background: none; border: none; color: var(--aqua-primary); cursor: pointer; margin-right: 8px;"><i class="fas fa-eye"></i></button>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="sFill"></div></div>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" class="input-field" id="regPassC" placeholder="تأكيد كلمة المرور" autocomplete="new-password">
                    <button class="eye-btn" type="button" onclick="toggleEye('regPassC', this)" style="background: none; border: none; color: var(--aqua-primary); cursor: pointer; margin-right: 8px;"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <button class="submit-btn" id="registerBtn" onclick="doRegister()">
                <i class="fas fa-user-plus"></i> تفعيل الحساب
            </button>
        </div>

        <div class="card-footer">
            MIKO HOST &copy; 2025 — <a href="https://t.me/a_u711" target="_blank"><i class="fab fa-telegram"></i> تواصل معنا</a>
        </div>
    </div>
</div>

<script>
    // ========== دوال تبديل النماذج ==========
    function showForm(type) {
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const tabLogin = document.getElementById('tabLoginBtn');
        const tabRegister = document.getElementById('tabRegisterBtn');
        
        if (type === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
        } else {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
        }
        // مسح الرسائل عند التبديل
        clearMsgs();
    }

    function clearMsgs() {
        const loginMsg = document.getElementById('loginMsg');
        const registerMsg = document.getElementById('registerMsg');
        if (loginMsg) { loginMsg.className = 'msg-box'; loginMsg.innerHTML = ''; }
        if (registerMsg) { registerMsg.className = 'msg-box'; registerMsg.innerHTML = ''; }
    }

    function showMsg(elementId, msg, type) {
        const el = document.getElementById(elementId);
        el.className = `msg-box ${type}`;
        el.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${msg}`;
    }

    // ========== إظهار/إخفاء كلمة المرور ==========
    function toggleEye(inputId, btn) {
        const inp = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            inp.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // ========== قوة كلمة المرور ==========
    function checkStrength(val) {
        const fill = document.getElementById('sFill');
        let strength = 0;
        if (val.length >= 4) strength++;
        if (val.length >= 8) strength++;
        if (/[A-Z]/.test(val)) strength++;
        if (/[0-9]/.test(val)) strength++;
        if (/[^a-zA-Z0-9]/.test(val)) strength++;
        const colors = ['#ff4444', '#ff8800', '#ffd700', '#00dc64', '#00e5ff'];
        const widths = ['10%', '30%', '55%', '80%', '100%'];
        const index = Math.min(strength, 4);
        fill.style.background = colors[index];
        fill.style.width = val.length ? widths[index] : '0%';
    }

    // ========== تسجيل الدخول ==========
    async function doLogin() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value.trim();
        if (!username || !password) {
            showMsg('loginMsg', 'يرجى ملء جميع الحقول', 'error');
            return;
        }
        const btn = document.getElementById('loginBtn');
        btn.classList.add('loading');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                showMsg('loginMsg', 'تم تسجيل الدخول ✅ جاري التحويل...', 'success');
                btn.innerHTML = '<i class="fas fa-check"></i> تم بنجاح';
                setTimeout(() => window.location.href = data.redirect || '/', 700);
            } else {
                showMsg('loginMsg', data.message || 'بيانات خاطئة', 'error');
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-arrow-left"></i> دخول للمنصة';
            }
        } catch (e) {
            showMsg('loginMsg', 'خطأ في الاتصال بالخادم', 'error');
            btn.classList.remove('loading');
            btn.innerHTML = '<i class="fas fa-arrow-left"></i> دخول للمنصة';
        }
    }

    // ========== إنشاء حساب ==========
    async function doRegister() {
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value.trim();
        const confirm = document.getElementById('regPassC').value.trim();
        if (!username || !password || !confirm) {
            showMsg('registerMsg', 'يرجى ملء جميع الحقول', 'error');
            return;
        }
        if (username.length < 3) {
            showMsg('registerMsg', 'اسم المستخدم يجب أن يكون 3 أحرف على الأقل', 'error');
            return;
        }
        if (password.length < 4) {
            showMsg('registerMsg', 'كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'error');
            return;
        }
        if (password !== confirm) {
            showMsg('registerMsg', 'كلمتا المرور غير متطابقتين', 'error');
            return;
        }
        const btn = document.getElementById('registerBtn');
        btn.classList.add('loading');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإنشاء...';
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                showMsg('registerMsg', 'تم إنشاء الحساب بنجاح ✅', 'success');
                btn.innerHTML = '<i class="fas fa-check"></i> تم!';
                setTimeout(() => showForm('login'), 1500);
            } else {
                showMsg('registerMsg', data.message || 'فشل إنشاء الحساب', 'error');
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-user-plus"></i> تفعيل الحساب';
            }
        } catch (e) {
            showMsg('registerMsg', 'خطأ في الاتصال بالخادم', 'error');
            btn.classList.remove('loading');
            btn.innerHTML = '<i class="fas fa-user-plus"></i> تفعيل الحساب';
        }
    }

    // التحقق من وجود جلسة نشطة (توجيه تلقائي)
    fetch('/api/current_user')
        .then(r => r.json())
        .then(d => {
            if (d.success) window.location.href = '/';
        })
        .catch(() => {});

    // إضافة مستمع لأزرار الإدخال (Enter)
    document.getElementById('loginPass').addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('regPassC').addEventListener('keypress', (e) => { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
