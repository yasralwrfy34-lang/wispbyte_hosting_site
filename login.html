<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MIKO HOST | الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--gold:#FFD700;--gold2:#FFA500;--red:#FF3D5A;--bg:#050609}
        body{font-family:'Tajawal',sans-serif;min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
        
        /* خلفية متحركة بتدرج لوني */
        .animated-bg{
            position:fixed;
            inset:0;
            z-index:0;
            background: linear-gradient(125deg, #0a0c10 0%, #1a0f1a 50%, #0f172a 100%);
            background-size: 200% 200%;
            animation: gradientShift 12s ease infinite;
        }
        @keyframes gradientShift{
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }
        
        .orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:orbF 12s infinite ease-in-out}
        .o1{width:520px;height:520px;background:rgba(255,215,0,.1);top:-120px;right:-120px;animation-delay:0s}
        .o2{width:420px;height:420px;background:rgba(255,61,90,.08);bottom:-80px;left:-80px;animation-delay:-4s}
        .o3{width:320px;height:320px;background:rgba(255,165,0,.07);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-8s}
        @keyframes orbF{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(28px,-36px) scale(1.05)}66%{transform:translate(-18px,28px) scale(.96)}}
        
        .grid-bg{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,215,0,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,215,0,.02) 1px,transparent 1px);background-size:60px 60px;animation:gridS 20s linear infinite}
        @keyframes gridS{0%{background-position:0 0}100%{background-position:60px 60px}}
        
        .particles{position:fixed;inset:0;z-index:0;pointer-events:none}
        .particle{position:absolute;width:2px;height:2px;background:var(--gold);border-radius:50%;animation:pRise linear infinite;opacity:0}
        @keyframes pRise{0%{opacity:0;transform:translateY(0) scale(0)}10%{opacity:.7}90%{opacity:.2}100%{opacity:0;transform:translateY(-100vh) scale(1.5)}}
        
        .wrapper{position:relative;z-index:10;width:100%;max-width:460px;margin:20px;animation:wIn .7s cubic-bezier(.34,1.56,.64,1)}
        @keyframes wIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        
        /* كارد بحواف دائرية */
        .glass-card{
            background:rgba(7,9,20,.8);
            backdrop-filter:blur(24px) saturate(1.6);
            border-radius:42px;
            border:1px solid rgba(255,215,0,.25);
            box-shadow:0 0 0 1px rgba(255,215,0,.08),0 30px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);
            padding:42px 34px;
            transition:border-color .3s,box-shadow .3s;
        }
        .glass-card:hover{border-color:rgba(255,215,0,.4);box-shadow:0 0 40px rgba(255,215,0,.12),0 30px 60px rgba(0,0,0,.6)}
        
        /* شعار MK نيون ونابض */
        .mk-logo{
            display:flex;
            align-items:center;
            justify-content:center;
            width:80px;
            height:80px;
            background:linear-gradient(145deg,#1a1f2e,#0a0c18);
            border-radius:32px;
            margin:0 auto 12px;
            box-shadow:0 0 0 2px rgba(255,215,0,0.2),0 0 0 5px rgba(0,0,0,0.2);
            transition:all 0.2s;
            animation:neonPulse 2s infinite ease-in-out;
        }
        .mk-logo span{
            font-family:'Orbitron',sans-serif;
            font-size:2.2rem;
            font-weight:900;
            background:linear-gradient(135deg,var(--gold),var(--gold2),#fff5cc);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            text-shadow:0 0 12px rgba(255,215,0,0.6);
            letter-spacing:2px;
        }
        @keyframes neonPulse{
            0%,100%{box-shadow:0 0 0 2px rgba(255,215,0,0.2),0 0 0 5px rgba(0,0,0,0.2);}
            50%{box-shadow:0 0 0 4px rgba(255,215,0,0.6),0 0 0 10px rgba(255,215,0,0.15);}
        }
        
        .logo-title{
            font-family:'Orbitron',sans-serif;
            font-size:1.8rem;
            font-weight:900;
            letter-spacing:4px;
            background:linear-gradient(135deg,var(--gold),var(--gold2),#fff8dc);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            display:block;
            margin-top:8px;
        }
        .welcome-text{
            font-size:.75rem;
            color:#6b7a9f;
            margin-top:6px;
            letter-spacing:1px;
            font-weight:400;
        }
        
        /* أزرار وحقول بحواف دائرية */
        .auth-tabs{
            display:flex;
            background:rgba(0,0,0,.4);
            border-radius:60px;
            padding:4px;
            margin-bottom:26px;
            border:1px solid rgba(255,255,255,.05);
        }
        .auth-tab{
            flex:1;
            padding:10px;
            border-radius:50px;
            border:none;
            background:transparent;
            color:#4b5a8b;
            font-family:'Tajawal',sans-serif;
            font-size:.88rem;
            font-weight:600;
            cursor:pointer;
            transition:all .2s;
        }
        .auth-tab.active{
            background:rgba(255,215,0,.15);
            color:var(--gold);
            box-shadow:0 0 12px rgba(255,215,0,.2);
        }
        
        .field-wrap{
            position:relative;
            display:flex;
            align-items:center;
            background:rgba(0,0,0,.45);
            border:1px solid rgba(255,215,0,.12);
            border-radius:60px;
            overflow:hidden;
            transition:all .2s;
        }
        .field-wrap:focus-within{
            border-color:rgba(255,215,0,.7);
            box-shadow:0 0 0 3px rgba(255,215,0,.2);
        }
        .field-icon{
            width:48px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#3a4868;
            font-size:.9rem;
        }
        .field-input{
            flex:1;
            background:transparent;
            border:none;
            outline:none;
            color:#eef2ff;
            font-family:'Tajawal',sans-serif;
            font-size:.9rem;
            padding:14px 0;
            direction:ltr;
            text-align:right;
        }
        .field-input::placeholder{color:#2a3350;font-size:.8rem;}
        .eye-btn{
            background:none;
            border:none;
            cursor:pointer;
            color:#3a4868;
            padding:0 16px;
            font-size:.9rem;
            transition:color .15s;
        }
        .eye-btn:hover{color:var(--gold);}
        
        .submit-btn{
            width:100%;
            padding:14px;
            background:linear-gradient(135deg,var(--gold),var(--gold2));
            border:none;
            border-radius:60px;
            color:#0a0808;
            font-family:'Tajawal',sans-serif;
            font-size:1rem;
            font-weight:800;
            letter-spacing:.5px;
            cursor:pointer;
            transition:all .22s;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            box-shadow:0 6px 20px rgba(255,215,0,.25);
            margin-top:8px;
        }
        .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,215,0,.35);}
        .submit-btn:active{transform:translateY(0);}
        .submit-btn.loading{opacity:.7;pointer-events:none;}
        
        .msg-box{
            padding:12px 16px;
            border-radius:60px;
            font-size:.8rem;
            margin-bottom:16px;
            display:none;
            align-items:center;
            gap:10px;
        }
        .msg-box.error{
            background:rgba(255,61,90,.12);
            border:1px solid rgba(255,61,90,.35);
            color:#ff8fa0;
            display:flex;
        }
        .msg-box.success{
            background:rgba(0,220,100,.1);
            border:1px solid rgba(0,220,100,.25);
            color:#6ee7b7;
            display:flex;
        }
        
        .strength-bar{
            height:4px;
            background:rgba(255,255,255,.05);
            border-radius:4px;
            margin-top:6px;
            overflow:hidden;
        }
        .strength-fill{
            height:100%;
            border-radius:4px;
            transition:width .3s,background .3s;
            width:0;
        }
        
        .card-footer{
            text-align:center;
            margin-top:24px;
            font-size:.68rem;
            color:#2a3350;
            border-top:1px solid rgba(255,255,255,.04);
            padding-top:18px;
        }
        .card-footer a{color:rgba(255,215,0,.6);text-decoration:none;}
        .card-footer a:hover{color:var(--gold);}
    </style>
</head>
<body>
<div class="animated-bg"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="grid-bg"></div>
<div class="particles" id="particles"></div>

<div class="wrapper">
  <div class="glass-card">
    <div class="logo-area">
      <div class="mk-logo"><span>MK</span></div>
      <span class="logo-title">MIKO HOST</span>
      <div class="welcome-text"><i class="fas fa-cloud-upload-alt"></i> مرحباً بك في مستقبل الاستضافة السحابية</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabL" onclick="showTab('login')"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
      <button class="auth-tab" id="tabR" onclick="showTab('register')"><i class="fas fa-user-plus"></i> إنشاء حساب</button>
    </div>

    <div class="auth-form active" id="loginForm">
      <div class="msg-box" id="loginMsg"></div>
      <div class="field">
        <label class="field-label">اسم المستخدم</label>
        <div class="field-wrap"><div class="field-icon"><i class="fas fa-user"></i></div>
          <input class="field-input" id="loginUser" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
      </div>
      <div class="field">
        <label class="field-label">كلمة المرور</label>
        <div class="field-wrap"><div class="field-icon"><i class="fas fa-lock"></i></div>
          <input class="field-input" id="loginPass" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
          <button class="eye-btn" onclick="toggleEye('loginPass',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button class="submit-btn" id="loginBtn" onclick="doLogin()"><i class="fas fa-arrow-left"></i> دخول</button>
    </div>

    <div class="auth-form" id="registerForm">
      <div class="msg-box" id="registerMsg"></div>
      <div class="field">
        <label class="field-label">اسم المستخدم</label>
        <div class="field-wrap"><div class="field-icon"><i class="fas fa-user"></i></div>
          <input class="field-input" id="regUser" type="text" placeholder="3 أحرف على الأقل" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label class="field-label">كلمة المرور</label>
        <div class="field-wrap"><div class="field-icon"><i class="fas fa-lock"></i></div>
          <input class="field-input" id="regPass" type="password" placeholder="4 أحرف على الأقل" autocomplete="new-password" oninput="checkStrength(this.value)">
          <button class="eye-btn" onclick="toggleEye('regPass',this)"><i class="fas fa-eye"></i></button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="sFill"></div></div>
      </div>
      <div class="field">
        <label class="field-label">تأكيد كلمة المرور</label>
        <div class="field-wrap"><div class="field-icon"><i class="fas fa-lock"></i></div>
          <input class="field-input" id="regPassC" type="password" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()">
          <button class="eye-btn" onclick="toggleEye('regPassC',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button class="submit-btn" id="registerBtn" onclick="doRegister()"><i class="fas fa-user-plus"></i> إنشاء الحساب</button>
    </div>

    <div class="card-footer">MIKO HOST &copy; 2025 — <a href="https://t.me/a_u711" target="_blank"><i class="fab fa-telegram"></i> تواصل معنا</a></div>
  </div>
</div>

<script>
// توليد الجسيمات
(function(){
    const c=document.getElementById('particles');
    for(let i=0;i<38;i++){
        const p=document.createElement('div');
        p.className='particle';
        p.style.cssText=`left:${Math.random()*100}%;bottom:${Math.random()*10}%;width:${Math.random()*2.5+1}px;height:${Math.random()*2.5+1}px;animation-duration:${Math.random()*14+8}s;animation-delay:${Math.random()*10}s;`;
        c.appendChild(p);
    }
})();

// دوال عامة
function showTab(t){
    ['login','register'].forEach(x=>{
        document.getElementById(x+'Form').classList.toggle('active',x===t);
        document.getElementById('tab'+x[0].toUpperCase()).classList.toggle('active',x===t);
    });
    clearMsgs();
}
function clearMsgs(){
    ['loginMsg','registerMsg'].forEach(id=>{
        const el=document.getElementById(id);
        el.className='msg-box';
        el.innerHTML='';
    });
}
function showMsg(id,msg,type){
    const el=document.getElementById(id);
    el.className='msg-box '+type;
    el.innerHTML=`<i class="fas ${type==='error'?'fa-exclamation-circle':'fa-check-circle'}"></i> ${msg}`;
}
function toggleEye(id,btn){
    const inp=document.getElementById(id);
    const s=inp.type==='password';
    inp.type=s?'text':'password';
    btn.innerHTML=`<i class="fas fa-eye${s?'-slash':''}"></i>`;
}
function checkStrength(v){
    const f=document.getElementById('sFill');
    let s=0;
    if(v.length>=6)s++;
    if(v.length>=10)s++;
    if(/[A-Z0-9]/.test(v))s++;
    if(/[^a-zA-Z0-9]/.test(v))s++;
    const colors=['#ff4444','#ff8800','#ffd700','#00dc64'],widths=['20%','45%','70%','100%'];
    f.style.background=colors[s-1]||'#ff4444';
    f.style.width=v.length?(widths[s-1]||'10%'):'0';
}

// الحصول على IP العميل
async function getClientIP(){
    try{
        const res=await fetch('https://api.ipify.org?format=json');
        const data=await res.json();
        return data.ip;
    }catch(e){
        return null;
    }
}

// التحقق من حد الحسابات لكل IP
async function checkIPLimit(ip){
    try{
        const res=await fetch(`/api/check-ip-limit?ip=${encodeURIComponent(ip)}`);
        const data=await res.json();
        if(data.success) return data.count;
        return 0;
    }catch(e){
        console.warn('IP limit check failed',e);
        return 0;
    }
}

// تسجيل الدخول
async function doLogin(){
    const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value.trim();
    if(!u||!p){showMsg('loginMsg','يرجى ملء جميع الحقول','error');return;}
    const btn=document.getElementById('loginBtn');btn.classList.add('loading');btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';
    try{
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        const d=await r.json();
        if(d.success){
            showMsg('loginMsg','تم تسجيل الدخول ✅','success');
            btn.innerHTML='<i class="fas fa-check"></i> جاري التحويل...';
            setTimeout(()=>window.location.href=d.redirect||'/',700);
        }else{
            showMsg('loginMsg',d.message||'بيانات خاطئة','error');
            btn.classList.remove('loading');
            btn.innerHTML='<i class="fas fa-arrow-left"></i> دخول';
        }
    }catch(e){
        showMsg('loginMsg','خطأ في الاتصال','error');
        btn.classList.remove('loading');
        btn.innerHTML='<i class="fas fa-arrow-left"></i> دخول';
    }
}

// إنشاء حساب مع التحقق من IP
async function doRegister(){
    const u=document.getElementById('regUser').value.trim();
    const p=document.getElementById('regPass').value.trim();
    const c=document.getElementById('regPassC').value.trim();
    
    if(!u||!p){showMsg('registerMsg','يرجى ملء جميع الحقول','error');return;}
    if(u.length<3){showMsg('registerMsg','اسم المستخدم 3 أحرف على الأقل','error');return;}
    if(p.length<4){showMsg('registerMsg','كلمة المرور 4 أحرف على الأقل','error');return;}
    if(p!==c){showMsg('registerMsg','كلمتا المرور غير متطابقتين','error');return;}
    
    // التحقق من حد IP
    const ip=await getClientIP();
    if(ip){
        const count=await checkIPLimit(ip);
        if(count>=3){
            showMsg('registerMsg','عذراً، لقد وصلت للحد الأقصى المسموح به من الحسابات لهذا الجهاز (3 حسابات كحد أقصى)','error');
            return;
        }
    }
    
    const btn=document.getElementById('registerBtn');
    btn.classList.add('loading');
    btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري الإنشاء...';
    try{
        const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,client_ip:ip})});
        const d=await r.json();
        if(d.success){
            showMsg('registerMsg','تم إنشاء الحساب ✅','success');
            btn.innerHTML='<i class="fas fa-check"></i> تم!';
            setTimeout(()=>showTab('login'),1500);
        }else{
            showMsg('registerMsg',d.message||'فشل الإنشاء','error');
            btn.classList.remove('loading');
            btn.innerHTML='<i class="fas fa-user-plus"></i> إنشاء الحساب';
        }
    }catch(e){
        showMsg('registerMsg','خطأ في الاتصال','error');
        btn.classList.remove('loading');
        btn.innerHTML='<i class="fas fa-user-plus"></i> إنشاء الحساب';
    }
}

// التحقق من تسجيل الدخول الحالي
fetch('/api/current_user').then(r=>r.json()).then(d=>{if(d.success)window.location.href='/';});
</script>
</body>
</html>
